name: Performance benchmark

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Benchmark or certify the current ref
        required: true
        default: full
        type: choice
        options:
          - full
          - operational-candidate
      native_run_id:
        description: Successful Native runtime evidence run used for candidate certification
        required: false
        type: string
      benchmark_baseline:
        description: Committed matching-runner baseline required for candidate certification
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Run representative benchmark suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          python3 -m tools.design_craft benchmark
          --scale smoke
          --output "${RUNNER_TEMP}/benchmark-result-smoke.json"
      - name: Upload smoke benchmark evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-smoke-${{ github.run_id }}
          path: ${{ runner.temp }}/benchmark-result-smoke.json
          if-no-files-found: error
          retention-days: 30

  full:
    name: Fixed-runner three-run full stability experiment
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: f52ac60ad8fcebad89b125d761775bf5050cc4d0
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Execute all three predeclared full measurements on this runner
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 - <<'PY_STABILITY'
          """Predeclared three-run stability experiment; no sample filtering or promotion."""
          import hashlib
          import json
          import os
          from pathlib import Path
          import platform
          import resource
          import subprocess
          import sys
          import time

          sys.path.insert(0, str(Path.cwd()))
          from tools.design_craft.benchmark.contract import compare_results

          TARGET = 'f52ac60ad8fcebad89b125d761775bf5050cc4d0'
          BASELINE = Path('benchmarks/baselines/v0.7.0-linux-x86_64-python3.13.json')
          OUT = Path(os.environ['RUNNER_TEMP']) / 'route-pack-stability'
          OUT.mkdir(exist_ok=False)

          def git(*args):
              return subprocess.check_output(['git',*args],text=True).strip()

          def signals():
              result = {}
              for name in ['/proc/pressure/cpu','/proc/pressure/io','/sys/fs/cgroup/cpu.stat','/sys/fs/cgroup/cpu.max']:
                  p=Path(name)
                  if p.is_file(): result[name]=p.read_text()
              return result

          def verify_source():
              if git('rev-parse','HEAD') != TARGET or git('status','--porcelain=v1','--untracked-files=all'):
                  raise RuntimeError('source SHA or clean-worktree invariant failed')

          verify_source()
          base=json.loads(BASELINE.read_text())
          plan=dict(schema='design-craft.full-stability-plan.v1',target_sha=TARGET,runs=3,
                    baseline=str(BASELINE),baseline_sha256=hashlib.sha256(BASELINE.read_bytes()).hexdigest(),
                    acceptance='All three complete full runs must pass the unchanged baseline comparison, and all ordered pairwise comparisons must pass.',
                    stop_rule='No automatic retries. Execution failure stops collection; timing comparison failure does not discard later predeclared runs.',
                    non_actions=['No baseline promotion','No threshold changes','No discarded samples','No release approval from this workflow alone'])
          (OUT/'plan.json').write_text(json.dumps(plan,indent=2)+'\n')
          result=dict(schema='design-craft.full-stability-result.v1',plan=plan,
                      source_sha=TARGET,workflow_sha=os.environ.get('GITHUB_SHA'),run_id=os.environ.get('GITHUB_RUN_ID'),
                      cpu_model=next((line.split(':',1)[1].strip() for line in Path('/proc/cpuinfo').read_text().splitlines() if line.startswith('model name')),'unknown') if Path('/proc/cpuinfo').is_file() else platform.processor(),
                      cpu_count=os.cpu_count(),python=sys.version,platform=platform.platform(),
                      image_os=os.environ.get('ImageOS'),image_version=os.environ.get('ImageVersion'),runs=[],pairwise=[],ok=False)

          def save():
              (OUT/'experiment.json').write_text(json.dumps(result,indent=2)+'\n')

          payloads=[]
          for index in range(1,4):
              verify_source()
              print(f'START full run {index}/3',flush=True)
              output=OUT/f'full-{index}.json'
              pre=signals(); usage=resource.getrusage(resource.RUSAGE_CHILDREN); started=time.perf_counter()
              with (OUT/f'full-{index}.log').open('w') as log:
                  try:
                      process=subprocess.run([sys.executable,'-m','tools.design_craft','benchmark','--scale','full','--output',str(output)],stdout=log,stderr=subprocess.STDOUT,timeout=900)
                      returncode=process.returncode
                  except subprocess.TimeoutExpired:
                      returncode=124
                      log.write('\nExecution timed out after the declared 900-second limit.\n')
              after=resource.getrusage(resource.RUSAGE_CHILDREN)
              row=dict(index=index,exit_code=returncode,wall_seconds=time.perf_counter()-started,
                       child_user_cpu_seconds=after.ru_utime-usage.ru_utime,child_system_cpu_seconds=after.ru_stime-usage.ru_stime,
                       voluntary_context_switches=after.ru_nvcsw-usage.ru_nvcsw,involuntary_context_switches=after.ru_nivcsw-usage.ru_nivcsw,
                       signals_before=pre,signals_after=signals())
              result['runs'].append(row)
              if returncode:
                  save(); raise SystemExit(returncode)
              verify_source()
              current=json.loads(output.read_text())
              if current['source_commit'] != TARGET or current['source_dirty'] is not False:
                  save(); raise RuntimeError('benchmark provenance invalid')
              payloads.append(current)
              row['output']=output.name; row['sha256']=hashlib.sha256(output.read_bytes()).hexdigest()
              row['comparison']=compare_results(base,current)
              row['route_pack']=current['metrics']['route_pack']
              save()
              print(f"RESULT full run {index}/3: baseline_ok={row['comparison']['ok']} route_pack_p95={row['route_pack']['p95']} errors={row['comparison']['errors']}",flush=True)
          for i,a in enumerate(payloads):
              for j,b in enumerate(payloads):
                  if i != j:
                      result['pairwise'].append(dict(baseline_index=i+1,current_index=j+1,comparison=compare_results(a,b)))
          result['ok']=all(r['comparison']['ok'] for r in result['runs']) and all(p['comparison']['ok'] for p in result['pairwise'])
          verify_source(); result['worktree_unchanged']=True; save()
          print('EXPERIMENT PASS' if result['ok'] else 'EXPERIMENT FAIL',flush=True)
          raise SystemExit(0 if result['ok'] else 1)
          PY_STABILITY
      - name: Upload every result including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: route-pack-stability-${{ github.run_id }}
          path: ${{ runner.temp }}/route-pack-stability
          if-no-files-found: error
          retention-days: 90

  operational-candidate:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'operational-candidate'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Validate benchmark baseline
        env:
          BENCHMARK_BASELINE: ${{ inputs.benchmark_baseline }}
        run: |
          [[ "${BENCHMARK_BASELINE}" == benchmarks/baselines/* ]]
          [[ "${BENCHMARK_BASELINE}" != *..* ]]
          test -f "${BENCHMARK_BASELINE}"
      - name: Validate native evidence run
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_RUN_ID: ${{ inputs.native_run_id }}
        run: |
          if [[ ! "${NATIVE_RUN_ID}" =~ ^[1-9][0-9]*$ ]]; then
            echo "native_run_id must be a positive GitHub Actions run ID" >&2
            exit 2
          fi
          run_state="$(gh run view "${NATIVE_RUN_ID}" --json conclusion,status,workflowName,headSha --jq '[.status, .conclusion, .workflowName, .headSha] | join("|")')"
          if [[ "${run_state}" != "completed|success|Native runtime evidence|${GITHUB_SHA}" ]]; then
            echo "native_run_id must reference successful current-source Native runtime evidence; got ${run_state}" >&2
            exit 1
          fi
      - name: Download native runtime evidence
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_RUN_ID: ${{ inputs.native_run_id }}
        run: |
          evidence_root="${RUNNER_TEMP}/native-evidence"
          mkdir -p "${evidence_root}/ios" "${evidence_root}/android" "${evidence_root}/combined"
          gh run download "${NATIVE_RUN_ID}" --name "native-runtime-ios-${NATIVE_RUN_ID}" --dir "${evidence_root}/ios"
          gh run download "${NATIVE_RUN_ID}" --name "native-runtime-android-${NATIVE_RUN_ID}" --dir "${evidence_root}/android"
          cp -R "${evidence_root}/ios/." "${evidence_root}/combined/"
          cp -R "${evidence_root}/android/." "${evidence_root}/combined/"
          test -f "${evidence_root}/combined/ios-observed.json"
          test -f "${evidence_root}/combined/android-observed.json"
      - name: Run immutable full benchmark
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          python3 -m tools.design_craft benchmark
          --scale full
          --output "${RUNNER_TEMP}/operational-candidate/benchmark-result-full.json"
      - name: Certify Operational 95 release candidate
        env:
          BENCHMARK_BASELINE: ${{ inputs.benchmark_baseline }}
          DESIGN_CRAFT_NATIVE_EVIDENCE_ROOT: ${{ runner.temp }}/native-evidence/combined
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          make release-readiness-operational
          BENCHMARK_BASELINE="${BENCHMARK_BASELINE}"
          BENCHMARK_RESULT="${RUNNER_TEMP}/operational-candidate/benchmark-result-full.json"
          OPERATIONAL_CANDIDATE_EVIDENCE="${RUNNER_TEMP}/operational-candidate/dist/evidence/operational-95-candidate.json"
      - name: Upload Operational 95 candidate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: operational-candidate-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/operational-candidate/benchmark-result-full.json
            ${{ runner.temp }}/operational-candidate/dist/evidence/operational-95-candidate.json
          if-no-files-found: error
          retention-days: 90
